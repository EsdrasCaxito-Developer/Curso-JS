<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div id="dados">
            <p>Ínicio
                <input type="number" name="" id="txti">
            </p>
            <p>Fim
                <input type="number" name="" id="txtf">
            </p>
            <p>Passo 
                <input type="number" name="" id="txtp">
            </p>
            <input 
                type="button" 
                value="Contar" 
                onclick="contar()">
        </div>
        <div id="res" style="padding-block-start: 2rem;">
            Preparando a contagem...
        </div>
    </section>

    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
