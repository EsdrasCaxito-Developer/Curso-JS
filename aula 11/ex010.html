<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel">
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res"></div>
    <script>
        let calcular = () =>{
            let vel = Number(document.getElementById("txtvel").value);
            let res = document.getElementById("res");
            res.innerHTML = `Sua velocidade atual é de <strong>${vel}</strong> km/h`;
            
            if(vel > 60){
                res.innerHTML = "Você está <strong>multado</strong>!";
            }
            res.innerHTML += "<p>Dirija sempre com o cinto de segurança!</p>"
        }
    </script>
</body>
</html>
